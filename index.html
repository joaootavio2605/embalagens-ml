<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Embalagens ML</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
    }

    #reader {
      max-width: 500px;
      margin: 20px auto;
      background: white;
    }

    #status {
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
      border-radius: 12px;
      background: #ddd;
    }

    .sucesso {
      background: #b7f7b7 !important;
    }

    .erro {
      background: #ffb8b8 !important;
    }
  </style>
</head>

<body>

  <h1>📦 Embalagens ML</h1>

  <p>Aponte a câmera para o QR da etiqueta</p>

  <div id="reader"></div>

  <div id="status">
    Aguardando leitura...
  </div>

  <script>

    let bloqueado = false;

    const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbyQ0cAS5Ilt-BIwfMCprioWFawAYVNvjyutO4O7cdPD7fYNupsNVpFHMhl863HvxbK3DA/exec";

    function qrLido(texto) {

      if (bloqueado) return;

      bloqueado = true;

      let id = texto;

      try {
        const objeto = JSON.parse(texto);

        if (objeto.id) {
          id = objeto.id;
        }

      } catch (e) {}

      document.getElementById("status").innerHTML =
        "✓ QR LIDO<br>ID: " + id;

      document.getElementById("status")
        .classList.add("sucesso");

      if (navigator.vibrate) {
        navigator.vibrate(200);
      }

      console.log("QR lido:", texto);

      fetch(URL_SCRIPT + "?id=" + encodeURIComponent(id), {
  method: "GET",
  mode: "no-cors"
});

      setTimeout(function() {

        bloqueado = false;

        document.getElementById("status").innerHTML =
          "Aguardando próxima embalagem...";

        document.getElementById("status")
          .classList.remove("sucesso");

      }, 2500);
    }


    const leitor = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        },
        rememberLastUsedCamera: true,
        supportedScanTypes: [
          Html5QrcodeScanType.SCAN_TYPE_CAMERA
        ]
      },
      false
    );

    leitor.render(qrLido);

  </script>

</body>
</html>
